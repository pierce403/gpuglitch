[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "ga100ctl"
version = "0.4.0"
readme = "README.md"
description = "Local GPU inventory, validation and Pico USB diagnostics"
license = {file = "LICENSE"}
requires-python = ">=3.10"
dependencies = []

[project.scripts]
ga100ctl = "ga100ctl.cli:main"

[tool.setuptools]
packages = ["ga100ctl"]

[tool.setuptools.package-data]
ga100ctl = ["simulated.json"]

[tool.setuptools.data-files]
"share/ga100ctl/firmware" = ["firmware/CMakeLists.txt", "firmware/main.c"]
