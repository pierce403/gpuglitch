<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 310" role="img" aria-labelledby="title desc"><title id="title">Pico to GPU glitch signal map</title><desc id="desc">Four signal wires connect GP0 to I2CC SDA, GP1 to I2CC SCL, GP22 to PEX_RST_BUF* and GND to GPU ground. USB and PCIe connect both devices to the host.</desc><rect width="620" height="310" fill="#202922"/><g fill="#edf3e8" font-family="Arial,sans-serif" font-size="16"><text x="37" y="35">Pico 2 / 2 W</text><text x="447" y="35">CMP 170HX PCB</text></g><g stroke="#87988a" fill="#334338"><rect x="30" y="50" width="150" height="218" rx="6"/><rect x="440" y="50" width="150" height="218" rx="6"/></g><g stroke="#f6a474" stroke-width="2"><path d="M180 92H440M180 135H440M180 178H440M180 221H440"/></g><g fill="#f6f8ed" font-family="monospace" font-size="14"><text x="52" y="97">GP0</text><text x="52" y="140">GP1</text><text x="52" y="183">GP22</text><text x="52" y="226">GND</text><text x="458" y="97">I2CC SDA</text><text x="458" y="140">I2CC SCL</text><text x="448" y="183">PEX_RST_BUF*</text><text x="458" y="226">GND</text></g><g fill="#aebcaf" font-family="Arial,sans-serif" font-size="13"><text x="32" y="295">USB to host</text><text x="475" y="295">PCIe to host</text></g></svg>
