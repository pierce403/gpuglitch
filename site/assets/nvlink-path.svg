<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 250" role="img" aria-labelledby="title desc">
  <title id="title">NVLink enablement path</title>
  <desc id="desc">Five functional requirements: FF option, U11 reference clock circuit, ROM check, bridge, and verified transfer. This is not a PCB pad map.</desc>
  <rect width="720" height="250" fill="#f2f5ed"/>
  <path d="M93 119H640" stroke="#a9b7aa" stroke-width="3" stroke-dasharray="7 7"/>
  <g font-family="Arial,Helvetica,sans-serif" text-anchor="middle">
    <g fill="#284434">
      <circle cx="87" cy="119" r="24"/><circle cx="224" cy="119" r="24"/><circle cx="361" cy="119" r="24"/><circle cx="498" cy="119" r="24"/><circle cx="635" cy="119" r="24"/>
    </g>
    <g fill="#fff" font-size="17" font-weight="700">
      <text x="87" y="125">1</text><text x="224" y="125">2</text><text x="361" y="125">3</text><text x="498" y="125">4</text><text x="635" y="125">5</text>
    </g>
    <g fill="#26352a" font-size="15" font-weight="700">
      <text x="87" y="69">FF option</text><text x="224" y="69">U11 circuit</text><text x="361" y="69">ROM check</text><text x="498" y="69">NVLink bridge</text><text x="635" y="69">Real transfer</text>
    </g>
    <g fill="#566459" font-size="13">
      <text x="87" y="177">Die-specific</text><text x="224" y="177">Clock power</text><text x="361" y="177">Host-side step</text><text x="498" y="177">Two cards</text><text x="635" y="177">Verify link</text>
    </g>
  </g>
  <text x="360" y="226" fill="#856046" font-family="Arial,Helvetica,sans-serif" font-size="12" text-anchor="middle">Functional diagram · not a solder-pad map</text>
</svg>
